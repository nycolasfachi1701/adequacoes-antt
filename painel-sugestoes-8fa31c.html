<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Sugestões — Admin | CIOT ANTT</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.png" type="image/png">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
    --orange:#ff6600;
    --orange-dim:#cc5200;
    --bg:#111111;
    --surface:#1c1c1c;
    --surface2:#242424;
    --border:#333333;
    --text:#e8e8e8;
    --muted:#888888;
    --green:#22c55e;
    --blue:#3b82f6;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
    font-family:'Roboto',sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:32px 24px;
    min-height:100vh;
    background-image:
        radial-gradient(ellipse 60% 40% at 80% 10%, rgba(255,102,0,.06) 0%, transparent 60%),
        radial-gradient(ellipse 40% 30% at 10% 90%, rgba(255,102,0,.04) 0%, transparent 50%);
}
.wrap{max-width:1240px;margin:auto;display:flex;flex-direction:column;gap:24px;}

.head{
    display:flex;justify-content:space-between;align-items:flex-end;
    border-bottom:1px solid var(--border);padding-bottom:18px;position:relative;
}
.head::after{content:'';position:absolute;left:0;bottom:-1px;width:160px;height:2px;background:var(--orange);}
.head h1{font-size:28px;font-weight:900;letter-spacing:1px;}
.head h1 span{color:var(--orange);}
.head .logo{color:var(--orange);font-weight:900;font-size:18px;letter-spacing:2px;}
.back-link{color:var(--muted);text-decoration:none;font-size:13px;font-weight:700;}
.back-link:hover{color:var(--orange);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px;}

.config-grid{display:grid;grid-template-columns:1fr 220px auto;gap:14px;align-items:end;}
.f{display:flex;flex-direction:column;gap:6px;}
.f label{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--muted);}
.f input,.f select{
    background:#1d1d1d;border:1px solid #3a3a3a;border-radius:9px;padding:11px 13px;
    color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:.2s;width:100%;
}
.f input:focus,.f select:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(255,102,0,.14);}
.btn{
    background:var(--orange);color:#111;border:none;font-family:inherit;font-weight:800;
    font-size:14px;padding:12px 22px;border-radius:9px;cursor:pointer;transition:.2s;white-space:nowrap;
}
.btn:hover{background:var(--orange-dim);}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
.btn.ghost:hover{border-color:var(--orange);color:var(--orange);}
.btn:disabled{opacity:.6;cursor:progress;}
.config-note{font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;}

.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;}
.toolbar input,.toolbar select{
    background:#1d1d1d;border:1px solid #3a3a3a;border-radius:9px;padding:10px 13px;
    color:var(--text);font-family:inherit;font-size:14px;outline:none;
}
.toolbar input{flex:1;min-width:200px;}
.toolbar input:focus,.toolbar select:focus{border-color:var(--orange);}
.spacer{flex:1;}

.stats{display:flex;gap:12px;flex-wrap:wrap;}
.stat{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:12px 18px;min-width:120px;}
.stat b{display:block;font-size:24px;font-weight:900;color:var(--orange);}
.stat span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;}

.list{display:flex;flex-direction:column;gap:14px;}
.item{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--orange);border-radius:10px;overflow:hidden;transition:border-color .2s;}
.item.novo{border-left-color:var(--green);}
.item.open{border-color:var(--orange);}
.item-head{width:100%;background:none;border:none;color:var(--text);font-family:inherit;text-align:left;cursor:pointer;padding:16px 20px;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;}
.item-head:hover{background:rgba(255,102,0,.05);}
.item-headmain{flex:1;min-width:0;}
.item-right{display:flex;align-items:center;gap:14px;white-space:nowrap;}
.item-chevron{color:var(--orange);font-size:14px;transition:transform .25s;flex:0 0 auto;}
.item.open .item-chevron{transform:rotate(180deg);}
.item-tipo{display:inline-block;background:rgba(255,102,0,.14);color:var(--orange);font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:999px;margin-bottom:6px;}
.item-assunto{font-size:16px;font-weight:700;line-height:1.4;}
.item-preview{font-size:12px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:640px;}
.item.open .item-preview{display:none;}
.item-data{font-size:12px;color:var(--muted);white-space:nowrap;}
.item-body{display:none;padding:0 20px 18px;}
.item.open .item-body{display:block;}
.item-msg{color:var(--text);line-height:1.7;font-size:14px;white-space:pre-wrap;margin:0 0 12px;background:rgba(255,255,255,.02);border:1px solid var(--border);border-radius:8px;padding:14px 16px;}
.item-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);border-top:1px solid var(--border);padding-top:12px;}
.item-meta b{color:var(--text);font-weight:600;}
.item-meta a{color:var(--orange);text-decoration:none;}
.badge-novo{background:var(--green);color:#052e16;font-size:10px;font-weight:800;letter-spacing:1px;padding:2px 8px;border-radius:999px;margin-left:8px;}
.item-tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}
.item-reply,.item-del{font-family:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:8px;cursor:pointer;text-decoration:none;border:1px solid var(--border);background:transparent;transition:.2s;}
.item-reply{color:var(--text);}
.item-reply:hover{border-color:var(--orange);color:var(--orange);}
.item-del{color:#f87171;border-color:rgba(239,68,68,.35);}
.item-del:hover{background:rgba(239,68,68,.12);border-color:#ef4444;}

.empty{text-align:center;color:var(--muted);padding:50px 20px;font-size:15px;}
.msg-box{border-radius:10px;padding:14px 16px;font-size:14px;line-height:1.6;display:none;}
.msg-box.show{display:block;}
.msg-box.err{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#f87171;}
.msg-box.info{background:rgba(59,130,246,.1);border:1px solid rgba(59,130,246,.35);color:#93c5fd;}

@media(max-width:800px){
    .config-grid{grid-template-columns:1fr;}
    .head{flex-direction:column;align-items:flex-start;gap:12px;}
}
</style>
</head>
<body>
<div class="wrap">

    <div class="head">
        <div>
            <h1>Painel de <span>Sugestões</span></h1>
            <a class="back-link" href="index.html">← Voltar ao portal</a>
        </div>
        <div class="logo">NSTECH · ADMIN</div>
    </div>

    <div class="card">
        <div class="config-grid">
            <div class="f">
                <label for="endpoint">URL do Web App (Google Apps Script)</label>
                <input type="url" id="endpoint" placeholder="https://script.google.com/macros/s/.../exec">
            </div>
            <div class="f">
                <label for="token">Senha de acesso (ADMIN_TOKEN)</label>
                <input type="password" id="token" placeholder="sua senha secreta">
            </div>
            <button class="btn" id="loadBtn">Carregar</button>
        </div>
        <div class="config-note">
            Informe a URL do seu Web App e a mesma senha definida em <code>ADMIN_TOKEN</code> no script.
            Os dados são lidos direto da sua planilha (via JSONP) e a configuração fica salva neste navegador para os próximos acessos.
        </div>
    </div>

    <div class="msg-box" id="msgBox"></div>

    <div class="stats" id="stats" style="display:none;">
        <div class="stat"><b id="stTotal">0</b><span>Total</span></div>
        <div class="stat"><b id="stNovos">0</b><span>Novos</span></div>
        <div class="stat"><b id="stFiltrados">0</b><span>Exibindo</span></div>
    </div>

    <div class="card" id="toolbarCard" style="display:none;">
        <div class="toolbar">
            <input type="search" id="busca" placeholder="Buscar por assunto, texto, empresa, e-mail...">
            <select id="filtroTipo">
                <option value="">Todos os tipos</option>
                <option>Dúvida sobre a demanda</option>
                <option>Nova situação / cenário</option>
                <option>Sugestão de melhoria</option>
                <option>Outro</option>
            </select>
            <button class="btn ghost" id="reportBtn">📄 Gerar relatório</button>
            <button class="btn ghost" id="csvBtn">⬇ Exportar CSV</button>
        </div>
    </div>

    <div class="list" id="list"></div>

</div>

<script>
(function(){
    'use strict';

    const CFG = 'ciot_admin_cfg';
    let TODOS = [];

    const $ = id => document.getElementById(id);
    const endpointEl = $('endpoint');
    const tokenEl = $('token');
    const msgBox = $('msgBox');

    // Restaura config salva
    try{
        const cfg = JSON.parse(localStorage.getItem(CFG) || '{}');
        if(cfg.endpoint) endpointEl.value = cfg.endpoint;
        if(cfg.token) tokenEl.value = cfg.token;
    }catch(e){}

    function msg(tipo, texto){
        msgBox.className = 'msg-box show ' + tipo;
        msgBox.innerHTML = texto;
    }
    function limpaMsg(){ msgBox.className = 'msg-box'; }

    function fmtData(v){
        if(!v) return '—';
        const d = new Date(v);
        if(isNaN(d)) return String(v);
        return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    }
    function esc(s){
        return String(s == null ? '' : s)
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
            .replace(/"/g,'&quot;');
    }

    function jsonp(url){
        return new Promise((resolve, reject) => {
            const cbName = 'cb_' + Math.random().toString(36).slice(2);
            const s = document.createElement('script');
            const timer = setTimeout(() => { cleanup(); reject(new Error('Tempo esgotado. Verifique a URL e as permissões do Web App.')); }, 20000);
            function cleanup(){ clearTimeout(timer); delete window[cbName]; if(s.parentNode) s.parentNode.removeChild(s); }
            window[cbName] = data => { cleanup(); resolve(data); };
            s.onerror = () => { cleanup(); reject(new Error('Falha de rede ao contatar o Web App.')); };
            s.src = url + (url.indexOf('?') >= 0 ? '&' : '?') + 'callback=' + cbName;
            document.body.appendChild(s);
        });
    }

    async function carregarGoogle(){
        const endpoint = endpointEl.value.trim();
        const token = tokenEl.value.trim();
        if(!endpoint || !token){ msg('err', '⚠ Preencha a URL do Web App e a senha de acesso.'); return; }

        localStorage.setItem(CFG, JSON.stringify({endpoint, token}));
        const btn = $('loadBtn');
        btn.disabled = true; btn.textContent = 'Carregando...';
        limpaMsg();
        try{
            const url = endpoint + '?token=' + encodeURIComponent(token);
            const res = await jsonp(url);
            if(!res || !res.ok){
                msg('err', '⚠ ' + (res && res.error === 'unauthorized' ? 'Senha incorreta.' : 'Não foi possível carregar. ' + (res && res.error ? res.error : '')));
                return;
            }
            TODOS = (res.items || []).map(normaliza);
            render();
            msg('info', '✓ ' + TODOS.length + ' sugestão(ões) carregada(s) da planilha.');
        }catch(err){
            msg('err', '⚠ ' + err.message);
        }finally{
            btn.disabled = false; btn.textContent = 'Carregar';
        }
    }

    async function excluir(row){
        if(!row){ return; }
        if(!confirm('Excluir esta sugestão definitivamente? Esta ação não pode ser desfeita.')) return;
        const endpoint = endpointEl.value.trim();
        const token = tokenEl.value.trim();
        if(!endpoint || !token){ msg('err', '⚠ Carregue as sugestões antes de excluir.'); return; }
        limpaMsg();
        try{
            const url = endpoint + '?token=' + encodeURIComponent(token) + '&action=delete&row=' + encodeURIComponent(row);
            const res = await jsonp(url);
            if(res && res.ok){
                msg('info', '🗑 Sugestão excluída. Atualizando lista...');
                await carregarGoogle();
            } else {
                msg('err', '⚠ Não foi possível excluir. ' + (res && res.error ? res.error : ''));
            }
        }catch(err){
            msg('err', '⚠ ' + err.message);
        }
    }

    function normaliza(r){
        return {
            row: r.row || null,
            data: r.data || r.enviadoEm || '',
            tipo: r.tipo || '',
            assunto: r.assunto || '',
            mensagem: r.mensagem || '',
            nome: r.nome || '',
            empresa: r.empresa || '',
            email: r.email || '',
            origem: r.origem || '',
            status: r.status || 'Novo'
        };
    }

    function filtrados(){
        const termo = $('busca').value.trim().toLowerCase();
        const tipo = $('filtroTipo').value;
        return TODOS.filter(it => {
            if(tipo && it.tipo !== tipo) return false;
            if(!termo) return true;
            const blob = (it.assunto+' '+it.mensagem+' '+it.nome+' '+it.empresa+' '+it.email+' '+it.tipo).toLowerCase();
            return blob.indexOf(termo) >= 0;
        });
    }

    function render(){
        $('stats').style.display = 'flex';
        $('toolbarCard').style.display = 'block';
        const lista = filtrados();
        $('stTotal').textContent = TODOS.length;
        $('stNovos').textContent = TODOS.filter(it => (it.status||'').toLowerCase() === 'novo').length;
        $('stFiltrados').textContent = lista.length;

        const box = $('list');
        if(!lista.length){
            box.innerHTML = '<div class="empty">Nenhuma sugestão para exibir.</div>';
            return;
        }
        box.innerHTML = lista.map(it => {
            const novo = (it.status||'').toLowerCase() === 'novo';
            const contato = [];
            if(it.nome) contato.push('<span>Nome: <b>'+esc(it.nome)+'</b></span>');
            if(it.empresa) contato.push('<span>Empresa: <b>'+esc(it.empresa)+'</b></span>');
            if(it.email) contato.push('<span>E-mail: <a href="mailto:'+esc(it.email)+'">'+esc(it.email)+'</a></span>');
            if(!contato.length) contato.push('<span style="color:var(--muted)">Sem dados de contato</span>');
            const previa = (it.mensagem || '').replace(/\s+/g,' ').trim().slice(0,120);
            return '<div class="item'+(novo?' novo':'')+'">'
                + '<button type="button" class="item-head" aria-expanded="false">'
                + '<div class="item-headmain">'
                + '<span class="item-tipo">'+esc(it.tipo || 'Sugestão')+'</span>'
                + (novo?'<span class="badge-novo">NOVO</span>':'')
                + '<div class="item-assunto">'+esc(it.assunto || '(sem assunto)')+'</div>'
                + (previa?'<div class="item-preview">'+esc(previa)+(it.mensagem.length>120?'…':'')+'</div>':'')
                + '</div>'
                + '<div class="item-right"><span class="item-data">'+esc(fmtData(it.data))+'</span><span class="item-chevron" aria-hidden="true">▾</span></div>'
                + '</button>'
                + '<div class="item-body">'
                + '<div class="item-msg">'+esc(it.mensagem || '(sem descrição)')+'</div>'
                + '<div class="item-meta">'+contato.join('')+'</div>'
                + '<div class="item-tools">'
                + (it.email?'<a class="item-reply" href="mailto:'+esc(it.email)+'?subject='+encodeURIComponent('Re: '+(it.assunto||'sua sugestão'))+'">✉ Responder</a>':'')
                + (it.row?'<button type="button" class="item-del" data-row="'+esc(it.row)+'">🗑 Excluir</button>':'')
                + '</div>'
                + '</div>'
                + '</div>';
        }).join('');
    }

    function exportarCSV(){
        const lista = filtrados();
        if(!lista.length){ msg('err', 'Nada para exportar.'); return; }
        const cols = ['data','tipo','assunto','mensagem','nome','empresa','email','status'];
        const cab = ['Data','Tipo','Assunto','Mensagem','Nome','Empresa','E-mail','Status'];
        const linhas = [cab.join(';')];
        lista.forEach(it => {
            linhas.push(cols.map(c => '"' + String(it[c]==null?'':it[c]).replace(/"/g,'""') + '"').join(';'));
        });
        const blob = new Blob(['﻿' + linhas.join('\r\n')], {type:'text/csv;charset=utf-8;'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'sugestoes-ciot.csv';
        a.click();
        URL.revokeObjectURL(a.href);
    }

    function gerarRelatorio(){
        const lista = filtrados();
        if(!lista.length){ msg('err', 'Nada para gerar no relatório.'); return; }

        const agora = new Date().toLocaleString('pt-BR');
        const tipoSel = $('filtroTipo').value;
        const termo = $('busca').value.trim();
        const filtros = [];
        if(tipoSel) filtros.push('Tipo: ' + tipoSel);
        if(termo) filtros.push('Busca: "' + termo + '"');

        // Contagem por tipo
        const porTipo = {};
        lista.forEach(it => { const t = it.tipo || 'Sem tipo'; porTipo[t] = (porTipo[t]||0)+1; });
        const resumoTipos = Object.keys(porTipo).map(t => '<li><b>'+esc(porTipo[t])+'</b> — '+esc(t)+'</li>').join('');

        const novos = lista.filter(it => (it.status||'').toLowerCase() === 'novo').length;

        const itensHTML = lista.map((it, i) => {
            const contato = [];
            if(it.nome) contato.push('Nome: <b>'+esc(it.nome)+'</b>');
            if(it.empresa) contato.push('Empresa: <b>'+esc(it.empresa)+'</b>');
            if(it.email) contato.push('E-mail: <b>'+esc(it.email)+'</b>');
            return '<article>'
                + '<div class="rt-num">#'+(i+1)+'</div>'
                + '<div class="rt-tipo">'+esc(it.tipo||'Sugestão')+((it.status||'').toLowerCase()==='novo'?' • NOVO':'')+'</div>'
                + '<h3>'+esc(it.assunto||'(sem assunto)')+'</h3>'
                + '<div class="rt-data">'+esc(fmtData(it.data))+'</div>'
                + '<p class="rt-msg">'+esc(it.mensagem||'(sem descrição)').replace(/\n/g,'<br>')+'</p>'
                + (contato.length?'<div class="rt-contato">'+contato.join(' &nbsp;·&nbsp; ')+'</div>':'')
                + '</article>';
        }).join('');

        const html = '<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">'
            + '<title>Relatório de Sugestões — CIOT ANTT</title><style>'
            + '*{box-sizing:border-box;margin:0;padding:0}'
            + 'body{font-family:Arial,Helvetica,sans-serif;color:#1a1a1a;padding:32px;max-width:900px;margin:auto;background:#fff}'
            + 'header{border-bottom:3px solid #ff6600;padding-bottom:14px;margin-bottom:22px;display:flex;justify-content:space-between;align-items:flex-end}'
            + 'h1{font-size:22px}h1 span{color:#ff6600}.logo{font-weight:bold;color:#ff6600;letter-spacing:1px}'
            + '.meta{font-size:12px;color:#555;margin-bottom:20px;line-height:1.6}'
            + '.cards{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}'
            + '.cbox{border:1px solid #ddd;border-radius:8px;padding:12px 16px;min-width:120px}'
            + '.cbox b{display:block;font-size:22px;color:#ff6600}.cbox span{font-size:11px;color:#666;text-transform:uppercase}'
            + 'ul.tipos{list-style:none;font-size:13px;color:#333;margin:6px 0 20px;columns:2}'
            + 'ul.tipos li{padding:2px 0}'
            + 'article{border:1px solid #e2e2e2;border-left:4px solid #ff6600;border-radius:8px;padding:16px 18px;margin-bottom:14px;page-break-inside:avoid}'
            + '.rt-num{float:right;color:#bbb;font-size:12px;font-weight:bold}'
            + '.rt-tipo{font-size:11px;font-weight:bold;color:#ff6600;text-transform:uppercase;letter-spacing:1px}'
            + 'article h3{font-size:16px;margin:4px 0}'
            + '.rt-data{font-size:12px;color:#777;margin-bottom:8px}'
            + '.rt-msg{font-size:13px;line-height:1.7;white-space:pre-wrap;margin-bottom:10px}'
            + '.rt-contato{font-size:12px;color:#555;border-top:1px solid #eee;padding-top:8px}'
            + '.actions{text-align:center;margin:24px 0}'
            + '.actions button{background:#ff6600;color:#fff;border:none;padding:12px 26px;font-size:14px;font-weight:bold;border-radius:8px;cursor:pointer}'
            + 'footer{margin-top:22px;border-top:1px solid #eee;padding-top:12px;font-size:11px;color:#999;text-align:center}'
            + '@media print{.actions{display:none}body{padding:0}}'
            + '</style></head><body>'
            + '<header><div><h1>Relatório de <span>Sugestões</span></h1></div><div class="logo">NSTECH · CIOT ANTT</div></header>'
            + '<div class="meta">Gerado em: <b>'+esc(agora)+'</b><br>Total no relatório: <b>'+lista.length+'</b>'
            + (filtros.length?'<br>Filtros aplicados: '+esc(filtros.join('  |  ')):'')+'</div>'
            + '<div class="cards"><div class="cbox"><b>'+lista.length+'</b><span>Sugestões</span></div>'
            + '<div class="cbox"><b>'+novos+'</b><span>Novas</span></div></div>'
            + '<h4 style="font-size:13px;color:#333">Por tipo</h4><ul class="tipos">'+resumoTipos+'</ul>'
            + '<div class="actions"><button onclick="window.print()">🖨 Imprimir / Salvar PDF</button></div>'
            + itensHTML
            + '<footer>Documento gerado pelo Painel de Sugestões — NSTECH</footer>'
            + '</body></html>';

        const win = window.open('', '_blank');
        if(!win){ msg('err', '⚠ O navegador bloqueou a janela do relatório. Permita pop-ups para este site e tente novamente.'); return; }
        win.document.open();
        win.document.write(html);
        win.document.close();
    }

    // Expandir/recolher e excluir ao clicar nos itens
    $('list').addEventListener('click', e => {
        const del = e.target.closest('.item-del');
        if(del){ e.stopPropagation(); excluir(parseInt(del.dataset.row, 10)); return; }
        const head = e.target.closest('.item-head');
        if(!head) return;
        const item = head.parentElement;
        const aberto = item.classList.toggle('open');
        head.setAttribute('aria-expanded', aberto ? 'true' : 'false');
    });

    $('loadBtn').addEventListener('click', carregarGoogle);
    $('reportBtn').addEventListener('click', gerarRelatorio);
    $('csvBtn').addEventListener('click', exportarCSV);
    $('busca').addEventListener('input', render);
    $('filtroTipo').addEventListener('change', render);
    tokenEl.addEventListener('keydown', e => { if(e.key === 'Enter') carregarGoogle(); });
})();
</script>
</body>
</html>
